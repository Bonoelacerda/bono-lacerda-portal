name: Build TWA Android AAB


on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest


    steps:
      - uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Create TWA Project
        run: |
          mkdir -p twa-build/app/src/main/res/{values,drawable,xml,mipmap-mdpi,mipmap-hdpi,mipmap-xhdpi,mipmap-xxhdpi,mipmap-xxxhdpi}
          mkdir -p twa-build/gradle/wrapper
          cat > twa-build/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "BonoLacerdaPortal"
          include ':app'
          EOF
          cat > twa-build/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF
          cat > twa-build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          cat > twa-build/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          cat > twa-build/app/build.gradle <<'APPEOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.bonolacerda.portal'
              compileSdk 35
              defaultConfig {
                  applicationId "com.bonolacerda.portal"
                  minSdk 21
                  targetSdk 35
                  versionCode 1
                  versionName "1.0.0"
                  manifestPlaceholders = [
                      hostName: "bono-lacerda-portal.vercel.app",
                      defaultUrl: "https://bono-lacerda-portal.vercel.app/",
                      launcherName: "B&L Portal",
